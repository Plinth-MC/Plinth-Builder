name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "platforms;android-34" > /dev/null

      - name: Build mods and Pojlib
        run: scripts/build.sh atumvr visor addon mods pojlib

      - name: Server zip
        run: |
          scripts/build.sh server
          mv outputs/Plinth-Server-1.20.1.zip "outputs/Plinth-Server-${VERSION#v}.zip"

      # BuildAndroid writes to <project>/../../outputs, so nest the project
      # two levels down to keep that inside the workspace.
      - name: Move wrapper
        run: |
          mkdir -p ci/unity
          mv QCXR-XR-Wrapper ci/unity/QCXR-XR-Wrapper

      - uses: actions/cache@v4
        with:
          path: ci/unity/QCXR-XR-Wrapper/Library
          key: unity-library-${{ hashFiles('ci/unity/QCXR-XR-Wrapper/Packages/packages-lock.json') }}

      - name: Unity build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.10f1
          targetPlatform: Android
          projectPath: ci/unity/QCXR-XR-Wrapper
          buildMethod: QuestCraftVisorBuild.BuildAndroid
          versioning: None
          customParameters: -holocraftVersion ${{ env.VERSION }}

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p outputs
          apk="outputs/Plinth-${VERSION#v}.apk"
          src=ci/outputs/Plinth-1.20.1.apk
          sudo chown "$(id -u)" "$src"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secret, shipping the debug-signed APK"
            cp "$src" "$apk"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$tools/zipalign" -f 4 "$src" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KEYSTORE_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Add-on jar
        run: cp HoloCraft-MR/build/libs/*[0-9].jar outputs/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          name: Plinth ${{ env.VERSION }}
          generate_release_notes: true
          files: outputs/*
